name: Android Release APK

on:
  push:
    branches: [v6-signed-release, v6-1-update-proof, v7-1000-questions]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Sync Android web assets
        run: node scripts/sync-android-assets.js
      - name: Run V7 question-bank tests
        run: node tests/v7-question-bank.test.js
      - name: Run Android V5 static tests
        run: node tests/android-v5.test.js
      - name: Run Android V6 release tests
        run: node tests/android-v6.test.js
      - name: Run Android V6.1+ update tests
        run: node tests/android-v6-1.test.js
      - name: Run Android V7 release tests
        run: node tests/android-v7.test.js
      - name: Build unsigned release APK
        run: gradle -p android :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-libre-1.2.0-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Collect Android signing tools
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          mkdir -p ci-signing-tools/lib
          cp "$BUILD_TOOLS_DIR/zipalign" ci-signing-tools/
          cp "$BUILD_TOOLS_DIR/apksigner" ci-signing-tools/
          cp "$BUILD_TOOLS_DIR/lib/apksigner.jar" ci-signing-tools/lib/
          if [ -d "$BUILD_TOOLS_DIR/lib64" ]; then cp -R "$BUILD_TOOLS_DIR/lib64" ci-signing-tools/; fi
          ldd "$BUILD_TOOLS_DIR/zipalign" || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-linux
          path: ci-signing-tools
          if-no-files-found: error
          retention-days: 14

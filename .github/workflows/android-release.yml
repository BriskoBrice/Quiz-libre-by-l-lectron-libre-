name: Android Release APK

on:
  push:
    branches: [v6-signed-release]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Sync Android web assets
        run: node scripts/sync-android-assets.js
      - name: Run Android V5 static tests
        run: node tests/android-v5.test.js
      - name: Run Android V6 release tests
        run: node tests/android-v6.test.js
      - name: Build unsigned release APK
        run: gradle -p android :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-libre-1.1.0-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
